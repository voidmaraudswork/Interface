<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS | Command Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Warp Speed Loading Screen -->
    <div id="warp-loader" class="hidden">
        <div class="loader-content">
            <div class="scanner"></div>
            <h2 class="loading-text">INITIALIZING WARP DRIVE...</h2>
            <p>SYNCING WITH STREAMLIT MODULE</p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <main class="content">
        <header>
            <div class="system-status">
                <span class="pulse"></span> SYSTEM: OPERATIONAL
            </div>
            <h1 class="glitch-title">NEXUS</h1>
            <div class="orbit-container">
                <div class="orbit-line"></div>
            </div>
        </header>

        <section class="project-grid">
            <!-- App Card 1 -->
            <div class="module-card">
                <div class="card-edge"></div>
                <div class="card-content">
                    <div class="tag">AI MODULE</div>
                    <h3>AICodeFlat</h3>
                    <p>Neural Processing Interface for Spatial Logic.</p>
                    <a href="https://aicodeflat.streamlit.app/" target="_blank" class="launch-btn">
                        <span>LAUNCH SYSTEM</span>
                        <div class="btn-glow"></div>
                    </a>
                </div>
            </div>

            <!-- App Card 2 -->
            <div class="module-card">
                <div class="card-edge"></div>
                <div class="card-content">
                    <div class="tag">DATA MODULE</div>
                    <h3>MovieVoid</h3>
                    <p>Cinematic Data Visualizer & Predictive Engine.</p>
                    <a href="https://movievoidup.streamlit.app/" target="_blank" class="launch-btn">
                        <span>LAUNCH SYSTEM</span>
                        <div class="btn-glow"></div>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
