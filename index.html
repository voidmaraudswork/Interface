<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --dark-space: #020205;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; background: var(--dark-space) !important;
            color: white !important; font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden; height: 100vh;
        }

        #canvas-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }

        .content {
            max-width: 1200px; margin: 0 auto; padding: 60px 20px; text-align: center;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif; font-size: 5rem;
            color: var(--neon-blue) !important; letter-spacing: 15px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
        }

        .project-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; margin-top: 50px;
        }

        .module-card {
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 30px; transition: 0.5s;
        }

        .module-card:hover {
            border-color: var(--neon-blue); transform: translateY(-10px);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        h3 { color: var(--neon-blue) !important; font-family: 'Orbitron'; }
        p { color: #e0e0e0 !important; }

        .launch-btn {
            display: inline-block; width: 100%; padding: 15px; margin-top: 20px;
            border: 1px solid var(--neon-blue); color: var(--neon-blue) !important;
            text-decoration: none; font-family: 'Orbitron'; letter-spacing: 2px;
            transition: 0.3s;
        }

        .launch-btn:hover {
            background: var(--neon-blue); color: black !important;
            box-shadow: 0 0 20px var(--neon-blue);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <main class="content">
        <h1 class="glitch-title">NEXUS</h1>
        <div class="project-grid">
            <div class="module-card">
                <h3>AICodeFlat</h3>
                <p>Neural Processing Interface for Spatial Logic.</p>
                <a href="https://aicodeflat.streamlit.app/" target="_blank" class="launch-btn">LAUNCH SYSTEM</a>
            </div>
            <div class="module-card">
                <h3>MovieVoid</h3>
                <p>Cinematic Data Visualizer & Predictive Engine.</p>
                <a href="https://movievoidup.streamlit.app/" target="_blank" class="launch-btn">LAUNCH SYSTEM</a>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, stars, starGeo;
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.z = 1; camera.rotation.x = Math.PI/2;
            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            starGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(6000 * 3);
            for(let i=0; i<6000; i++) {
                positions[i*3] = Math.random() * 600 - 300;
                positions[i*3+1] = Math.random() * 600 - 300;
                positions[i*3+2] = Math.random() * 600 - 300;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.7}));
            scene.add(stars);
            animate();
        }
        function animate() {
            const positions = starGeo.attributes.position.array;
            for(let i=0; i<6000; i++) {
                positions[i*3+1] -= 0.5;
                if(positions[i*3+1] < -300) positions[i*3+1] = 300;
            }
            starGeo.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        init();
    </script>
</body>
</html>
