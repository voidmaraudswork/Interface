name: Wake Streamlit App

on:
  schedule:
    - cron: '*/7 * * * *' # Every 7 minutes
  workflow_dispatch:      # Allows you to click a button to test it

jobs:
  wake_up_job:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Opt-in to Node.js 24

    steps:
      - name: Checkout code
        uses: actions/checkout@v5   # Latest release, Node.js 24 compatible

      - name: Set up Python
        uses: actions/setup-python@v6   # Latest release, Node.js 24 compatible
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run script
        run: python wake_up.py
        
